<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>@691xmdts</title><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="@691xmdts"><meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: header, then one card per match. Card: country flag + league + time, two team rows with colour badges, two price boxes, confidence bar. Single dark look by choice. */
:root {
  --bg: #0b1220; --card: #111a2c; --tile: #1b2740; --fg: #eaf0f7; --muted: #8b99b0;
  --line: #27344d; --go: #2fd48a; --go-soft: #0f2a22; --go-deep: #1a6b3c; --warn: #e0a95a;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  margin: 0;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.92rem; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--go); }
.dot.o { background: var(--tile); border: 1px solid var(--line); }
.match { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.league { display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem; color: var(--fg); min-width: 0; }
.flag { font-size: 1.4rem; line-height: 1; }
.time { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.time small { font-weight: 500; font-size: 0.78rem; color: var(--muted); margin-left: 4px; }
.teams { display: flex; flex-direction: column; gap: 8px; }
.team { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.3; min-width: 0; }
.team .nm { min-width: 0; overflow-wrap: anywhere; }
.team .home { font-family: var(--font-body); font-weight: 500; font-size: 0.75rem; color: var(--muted); background: var(--tile); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.badge { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.02em; border: 2px solid rgba(255,255,255,0.22); }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.box small { color: var(--muted); font-size: 0.8rem; }
.box b { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.25; overflow-wrap: anywhere; }
.box.pick { background: var(--go-soft); border-color: var(--go); }
.box.pick b { color: var(--go); }
.tick { color: var(--go); font-size: 0.8rem; font-weight: 600; }
.conf { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--tile); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--go); border-radius: 4px; }
.conf em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }
.skip { opacity: 0.75; }
.stepbox { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.stepbox h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row b { font-family: var(--font-display); white-space: nowrap; }
.row span { color: var(--go); font-weight: 600; text-align: right; min-width: 0; }
.row span.off { color: var(--warn); }
.btn { background: var(--go-deep); color: #fff; border: 0; border-radius: 16px; padding: 16px; width: 100%; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; cursor: pointer; }
.btn:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
.btn:active { filter: brightness(1.15); }
.note { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 0; }
.warn { color: var(--warn); font-size: 0.88rem; margin: 0; }
textarea { width: 100%; min-height: 200px; background: var(--tile); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 0.9rem; resize: vertical; }
.foot { color: var(--muted); font-size: 0.82rem; text-align: center; }
.foot a { color: var(--go); }
.badge{position:relative;overflow:hidden}.badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.chip{white-space:nowrap;background:var(--tile);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}.chip.on{background:var(--go-deep);border-color:var(--go);color:#fff}
[hidden]{display:none!important}.btn.alt{background:var(--tile);border:1px solid var(--line);margin-top:8px}.sel{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}.sel input{width:20px;height:20px;accent-color:#2fd48a}#imgbox{display:flex;flex-direction:column;gap:8px;align-items:center}#imgbox img{width:100%;border-radius:12px}.lock{font-size:.8rem;margin-left:6px}
</style></head><body>

<main>
  <header>
    <h1>⚽ @691xmdts</h1>
    <p class="sub" id="sub">กำลังโหลด...</p>
  </header>

  <div class="legend" aria-label="วิธีอ่าน">

    <div id="steps"></div>

  </section>

  <section class="stepbox" id="hist" hidden><h2>ผลที่แนะนำไป</h2><p class="note" id="hsum"></p><div id="hby"></div><div id="hlist"></div></section>

  <p class="warn">ราคาและเส้นต่อรองมาจากตลาด ราคาจริงของแต่ละเจ้าอาจต่างกัน ถ้าเจ้าตั้งสูง/ต่ำที่ 3 ขึ้นไป ให้ข้ามคู่นั้น</p>
  <p class="foot">ที่มา <a href="https://goal7.co">goal7</a>, <a href="https://www.kickoff.co.uk">Kickoff</a> · ข้อมูลจากสถิติ ไม่รับประกันผล</p>
</main>

<script>
(function () {
  var list = document.getElementById("list"), ta = document.getElementById("msg"), st = document.getElementById("status");
  var text = "", TH = {}, D = null, SEL = {}, SK = "ballsel", OUT = null, F = { lg: "", only: true };
  function tn(n) {
    n = String(n);
    var k = n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    if (TH[k] || TH[n.toLowerCase()]) return TH[k] || TH[n.toLowerCase()];
    var m = n.match(/^(.+?)\s+(W|Women)$/i); if (m) return tn(m[1]) + " (หญิง)";
    m = n.match(/^(.+?)\s+U-?(\d\d)$/i); if (m) return tn(m[1]) + " U" + m[2];
    m = n.match(/^(.+?)\s+(II|B)$/); if (m) return tn(m[1]) + " ทีมสอง";
    return n;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function team(x, home) {
    var ini = esc(x.n.replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase());
    return '<div class="team"><span class="badge" style="background:#34425f">' + ini +
      '<img alt="" src="' + esc(x.l) + '" onerror="this.remove()"></span><span class="nm">' + esc(tn(x.n)) + '</span>' +
      (home ? '<span class="home">เหย้า</span>' : '') + '</div>';
  }
  function box(l, v, pick) {
    return '<div class="box' + (pick ? ' pick' : '') + '"><small>' + l + '</small><b>' + esc(v) + '</b>' + (pick ? '<span class="tick">✓ เลือก</span>' : '') + '</div>';
  }
  function hm(t) { return t.replace(":", "."); }
  function fav(m) { var g = m.hc && m.hc.indexOf(" ต่อ ") > 0 ? m.hc.split(" ต่อ ")[0] : m.h.n; return tn(g); }
  function sg(t) { return t.replace(" ต่อ ", " -").replace(" รอง ", " +"); }
  function nm(m, t) { return t.replace(m.h.n, tn(m.h.n)).replace(m.a.n, tn(m.a.n)); }
  function best(m) {
    var a = m.ou && !m.ou.weak && m.ou.pct >= 62 ? { pct: m.ou.pct, txt: fav(m) + " " + m.ou.lab, k: "ou" } : null;
    var b = m.hp ? { pct: m.hp.pct, txt: nm(m, m.hp.lab), k: "hp" } : null;
    var r = a && b ? (a.pct >= b.pct + 3 ? a : b) : (a || b);
    return r && r.pct >= 60 ? r : null;
  }
  function manual(m) { return m.ou ? { pct: m.ou.pct, txt: fav(m) + " " + m.ou.lab, k: "ou" } : null; }
  function key(m) { return String(m.id || (m.ts + m.h.n)); }
  function pkOf(m) { var s = SEL[key(m)], auto = best(m); if (s === 0) return null; if (s === 1) return auto || manual(m); return auto; }
  function loadSel() { try { var o = JSON.parse(localStorage.getItem(SK) || "{}"); SEL = o.date === D.date ? (o.sel || {}) : {}; } catch (e) { SEL = {}; } }
  function saveSel() { try { localStorage.setItem(SK, JSON.stringify({ date: D.date, sel: SEL })); } catch (e) {} }

  function cards(ms) {
    return ms.map(function (m) {
      var can = !!(best(m) || manual(m));
      return '<article class="match' + (m.pk ? '' : ' skip') + '"><div class="top"><span class="league"><span class="flag">' + m.flag + '</span>' + esc(tn(m.lg)) +
        '</span><span class="time">' + esc(m.t) + '<small>' + esc(m.d) + '</small>' + (m.lock ? '<span class="lock" title="ล็อกแล้ว">🔒</span>' : '') + '</span></div><div class="teams">' + team(m.h, true) + team(m.a, false) + '</div>' +
        (m.pr && !(m.pr.h === 10 && m.pr.d === 45 && m.pr.a === 45) ? '<p class="note" style="text-align:left">โอกาสชนะ เหย้า ' + m.pr.h + '% · เสมอ ' + m.pr.d + '% · เยือน ' + m.pr.a + '%' + (m.elo != null ? ' · Elo เหย้า ' + m.elo + '%' : '') + '</p>' : '') +
        '<div class="prices">' + box("ต่อรอง", m.hp ? nm(m, m.hp.lab) : (m.hc ? sg(nm(m, m.hc)) : "ไม่มีราคา"), !!m.hp) + box("สูง/ต่ำ", m.ou ? (m.ou.weak ? m.ou.line : m.ou.lab) : "ไม่มีราคา", !!(m.ou && !m.ou.weak)) + '</div>' +
        ((m.hcs && m.hcs.length > 1) || (m.ous && m.ous.length > 1) ? '<p class="note" style="text-align:left">ราคาอื่น · ต่อรอง ' + esc((m.hcs || []).join(' · ')) + ' · สูง/ต่ำ ' + esc((m.ous || []).join(' · ')) + '</p>' : '') +
        (m.ou && !m.ou.weak ? '<div class="conf"><span>โอกาสจากราคาตลาด</span><div class="bar"><i style="width:' + m.ou.pct + '%"></i></div><em>' + m.ou.pct + '%</em></div>' : '') +
        '<label class="sel"><input type="checkbox" data-k="' + esc(key(m)) + '"' + (m.pk ? ' checked' : '') + (can ? '' : ' disabled') + '> เอาเข้าสเต็ป/ข้อความ</label></article>';
    }).join("");
  }
  function draw() {
    var ms = D.matches.filter(function (m) { return (!F.lg || m.lg === F.lg) && (!F.only || best(m) || SEL[key(m)] === 1); });
    if (F.only) ms = ms.slice().sort(function (a, b) { return ((best(b) || manual(b) || { pct: 0 }).pct) - ((best(a) || manual(a) || { pct: 0 }).pct); }).slice(0, 7);
    D.matches.forEach(function (m) { m.pk = pkOf(m); });
    list.innerHTML = ms.length ? cards(ms) : '<p class="note">ตอนนี้ยังไม่มีคู่เด็ด ลองกด "ทุกคู่"</p>';
    Array.prototype.forEach.call(document.getElementById("chips").children, function (c) { c.classList.toggle("on", c.getAttribute("data-k") === (F.only ? "only" : (F.lg || "all"))); });
  }
  function sel(picks, n) {
    var cap = Math.ceil(n * 0.6), chosen = [], rest = [], cnt = {};
    picks.forEach(function (m) { var k = m.pk.k; if (chosen.length < n && (cnt[k] || 0) < cap) { chosen.push(m); cnt[k] = (cnt[k] || 0) + 1; } else rest.push(m); });
    return chosen.concat(rest).slice(0, n);
  }
  function recompute() {
    D.matches.forEach(function (m) { m.pk = pkOf(m); });
    var picks = D.matches.filter(function (m) { return !!m.pk; }).sort(function (a, b) { return b.pk.pct - a.pk.pct; });
    var rows = "", out = ["⚽️บอลวันที่ " + D.date + "⚽️", ""];
    OUT = { date: D.date, steps: [], top: [] };
    [[3, "⚡"], [5, "🔥"], [7, "💣"]].forEach(function (s) {
      if (picks.length < s[0]) { rows += '<div class="row"><b>' + s[1] + ' สเต็ป ' + s[0] + '</b><span class="off">คู่ไม่พอ</span></div>'; return; }
      var c = sel(picks, s[0]).sort(function (a, b) { return a.ts - b.ts; });
      rows += '<div class="row"><b>' + s[1] + ' สเต็ป ' + s[0] + '</b><span>' + c.length + ' คู่ ดูในข้อความ</span></div>';
      out.push(s[1] + " สเต็ป " + s[0]);
      var ls = [];
      c.forEach(function (m) { out.push("⏰" + hm(m.t) + " " + m.pk.txt); ls.push({ t: hm(m.t), x: m.pk.txt }); });
      out.push("————————————");
      OUT.steps.push({ icon: s[1], n: s[0], lines: ls });
    });
    if (picks.length) {
      out.push("⭐ ตัวเน้นสุด");
      sel(picks, 3).forEach(function (m, i) { out.push(["🥇", "🥈", "🥉"][i] + " " + m.pk.txt); OUT.top.push({ m: ["🥇", "🥈", "🥉"][i], x: m.pk.txt }); });
      out.push("");
    }
    text = out.join("\n").replace(/\s+$/, ""); ta.value = text;
    document.getElementById("steps").innerHTML = rows;
  }
  function history(d) {
    var H = (d.history || []).filter(function (e) { return e.res !== null && e.res !== undefined; }).slice(-60).reverse();
    if (!H.length) return;
    var w = 0, l = 0, z = 0;
    H.forEach(function (e) { if (e.res > 0) w++; else if (e.res < 0) l++; else z++; });
    document.getElementById("hsum").textContent = "เข้า " + w + " · ตาย " + l + " · เจ๊า " + z + " (จาก " + H.length + " ที่เช็กผลแล้ว)";
    var ALL = (d.history || []).filter(function (e) { return e.res !== null && e.res !== undefined; });
    function cnt(a) { var w2 = 0, l2 = 0; a.forEach(function (e) { if (e.res > 0) w2++; else if (e.res < 0) l2++; }); return "เข้า " + w2 + " ตาย " + l2; }
    var by = '<div class="row"><b>สูง/ต่ำ</b><span>' + cnt(ALL.filter(function (e) { return e.k === "ou"; })) + '</span></div><div class="row"><b>ต่อรอง</b><span>' + cnt(ALL.filter(function (e) { return e.k === "hp"; })) + '</span></div>';
    var seen = {}; ALL.forEach(function (e) { if (e.lg) seen[e.lg] = 1; });
    Object.keys(seen).forEach(function (g) { var a = ALL.filter(function (e) { return e.lg === g; }); if (a.length >= 3) by += '<div class="row"><b>' + esc(g) + '</b><span>' + cnt(a) + '</span></div>'; });
    document.getElementById("hby").innerHTML = by;
    document.getElementById("hlist").innerHTML = H.map(function (e) {
      var what = e.k === "ou" ? tn(e.hn) + " พบ " + tn(e.an) + " " + (e.s === "over" ? "สูง " : "ต่ำ ") + e.lt
        : tn(e.team) + " " + (e.giver ? "-" : "+") + e.lt + " (" + tn(e.hn) + " พบ " + tn(e.an) + ")";
      var ic = e.res === 1 ? "✅ เข้า" : e.res === 0.5 ? "✅ ได้ครึ่ง" : e.res === 0 ? "➖ เจ๊า" : e.res === -0.5 ? "❌ เสียครึ่ง" : "❌ ตาย";
      return '<div class="row"><b>' + esc(e.d) + '</b><span style="color:var(--fg);font-weight:500;flex:1;text-align:left">' + esc(what) + ' · ' + e.gh + '-' + e.ga + '</span><span class="' + (e.res < 0 ? 'off' : '') + '">' + ic + '</span></div>';
    }).join("");
    document.getElementById("hist").hidden = false;
  }
  function render(d) {
    D = d; loadSel();
    document.getElementById("sub").textContent = "อัปเดตล่าสุด " + d.updated + " เวลาตามไทย";
    var chips = document.getElementById("chips"), lgs = [];
    d.matches.forEach(function (m) { if (lgs.indexOf(m.lg) < 0) lgs.push(m.lg); });
    chips.innerHTML = '<button class="chip" data-k="only">คู่เด็ด</button><button class="chip" data-k="all">ทุกคู่</button>' +
      lgs.map(function (x) { return '<button class="chip" data-k="' + esc(x) + '">' + esc(tn(x)) + '</button>'; }).join("");
    chips.onclick = function (ev) { var k = ev.target.getAttribute && ev.target.getAttribute("data-k"); if (!k) return; F.only = k === "only"; F.lg = (k === "all" || k === "only") ? "" : k; draw(); };
    list.onchange = function (ev) { var t = ev.target; if (!t.getAttribute || t.getAttribute("data-k") === null || t.type !== "checkbox") return; SEL[t.getAttribute("data-k")] = t.checked ? 1 : 0; saveSel(); recompute(); draw(); };
    if (!d.matches.length) { list.innerHTML = '<p class="note">ตอนนี้ยังไม่มีคู่ในลีกที่ติดตาม</p>'; }
    else { recompute(); draw(); }
    history(d);
  }

  function makeImage() {
    if (!OUT || (!OUT.steps.length && !OUT.top.length)) { st.textContent = "ยังไม่มีคู่ให้ทำรูป"; return; }
    var W = 1080, P = 64, y = P, rows = [];
    rows.push({ k: "h", x: "⚽ บอลวันที่ " + OUT.date });
    OUT.steps.forEach(function (s) { rows.push({ k: "s", x: s.icon + " สเต็ป " + s.n }); s.lines.forEach(function (l) { rows.push({ k: "l", t: l.t, x: l.x }); }); });
    if (OUT.top.length) { rows.push({ k: "s", x: "⭐ ตัวเน้นสุด" }); OUT.top.forEach(function (l) { rows.push({ k: "m", t: l.m, x: l.x }); }); }
    var H = P * 2 + rows.reduce(function (a, r) { return a + (r.k === "h" ? 110 : r.k === "s" ? 96 : 66); }, 0);
    var c = document.createElement("canvas"); c.width = W; c.height = H; var g = c.getContext("2d");
    var gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#0b1220"); gr.addColorStop(1, "#16223a"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.textBaseline = "middle";
    rows.forEach(function (r) {
      if (r.k === "h") { g.fillStyle = "#eaf0f7"; g.font = '700 60px Prompt, Sarabun, sans-serif'; g.fillText(r.x, P, y + 40); y += 110; }
      else if (r.k === "s") { g.fillStyle = "#2fd48a"; g.font = '700 46px Prompt, Sarabun, sans-serif'; g.fillText(r.x, P, y + 56); y += 96; }
      else { g.fillStyle = "#8b99b0"; g.font = '500 36px Prompt, Sarabun, sans-serif'; g.fillText(r.k === "l" ? "⏰ " + r.t : r.t, P, y + 28); g.fillStyle = "#eaf0f7"; g.font = '600 40px Prompt, Sarabun, sans-serif'; g.fillText(r.x, P + (r.k === "l" ? 210 : 90), y + 28); y += 66; }
    });
    var box = document.getElementById("imgbox");
    c.toBlob(function (blob) {
      if (!blob) { st.textContent = "สร้างรูปไม่สำเร็จ"; return; }
      var url = URL.createObjectURL(blob), file = null;
      try { file = new File([blob], "691xmdts.png", { type: "image/png" }); } catch (e) {}
      box.innerHTML = '<img alt="การ์ดสเต็ป" src="' + url + '"><p class="note">แตะค้างที่รูป แล้วเลือกบันทึก/แชร์</p>' + (file && navigator.canShare && navigator.canShare({ files: [file] }) ? '<button class="btn" id="shr" type="button">แชร์รูป</button>' : "");
      box.hidden = false;
      var b = document.getElementById("shr");
      if (b) b.onclick = function () { navigator.share({ files: [file] }).catch(function () {}); };
    }, "image/png");
  }
