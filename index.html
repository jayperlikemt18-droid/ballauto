<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BALL AUTO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
/* Layout: header, then one card per match. Card: country flag + league + time, two team rows with colour badges, two price boxes, confidence bar. Single dark look by choice. */
:root {
  --bg: #0b1220; --card: #111a2c; --tile: #1b2740; --fg: #eaf0f7; --muted: #8b99b0;
  --line: #27344d; --go: #2fd48a; --go-soft: #0f2a22; --go-deep: #1a6b3c; --warn: #e0a95a;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  margin: 0;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; margin: 0; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.92rem; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--go); }
.dot.o { background: var(--tile); border: 1px solid var(--line); }
.match { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.league { display: inline-flex; align-items: center; gap: 8px; font-size: 0.92rem; color: var(--fg); min-width: 0; }
.flag { font-size: 1.4rem; line-height: 1; }
.time { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.time small { font-weight: 500; font-size: 0.78rem; color: var(--muted); margin-left: 4px; }
.teams { display: flex; flex-direction: column; gap: 8px; }
.team { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.3; min-width: 0; }
.team .nm { min-width: 0; overflow-wrap: anywhere; }
.team .home { font-family: var(--font-body); font-weight: 500; font-size: 0.75rem; color: var(--muted); background: var(--tile); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.badge { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.02em; border: 2px solid rgba(255,255,255,0.22); }
.prices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.box small { color: var(--muted); font-size: 0.8rem; }
.box b { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.25; overflow-wrap: anywhere; }
.box.pick { background: var(--go-soft); border-color: var(--go); }
.box.pick b { color: var(--go); }
.tick { color: var(--go); font-size: 0.8rem; font-weight: 600; }
.conf { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--tile); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--go); border-radius: 4px; }
.conf em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }
.skip { opacity: 0.75; }
.stepbox { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.stepbox h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row b { font-family: var(--font-display); white-space: nowrap; }
.row span { color: var(--go); font-weight: 600; text-align: right; min-width: 0; }
.row span.off { color: var(--warn); }
.btn { background: var(--go-deep); color: #fff; border: 0; border-radius: 16px; padding: 16px; width: 100%; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; cursor: pointer; }
.btn:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
.btn:active { filter: brightness(1.15); }
.note { color: var(--muted); font-size: 0.85rem; text-align: center; margin: 0; }
.warn { color: var(--warn); font-size: 0.88rem; margin: 0; }
textarea { width: 100%; min-height: 200px; background: var(--tile); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 0.9rem; resize: vertical; }
.foot { color: var(--muted); font-size: 0.82rem; text-align: center; }
.foot a { color: var(--go); }
.badge{position:relative;overflow:hidden}.badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:5px}
</style></head><body>

<main>
  <header>
    <h1>⚽ BALL AUTO</h1>
    <p class="sub" id="sub">กำลังโหลด...</p>
  </header>

  <div class="legend" aria-label="วิธีอ่าน">
    <span><i class="dot"></i>ช่องสีเขียว คือช่องที่เลือก</span>
    <span><i class="dot o"></i>ช่องสีเทา คือราคาอ้างอิง</span>
  </div>

  <div id="list" style="display:contents">
    <!-- rendered by script below -->
  </div>

  <section class="stepbox" aria-label="สเต็ป">
    <h2>สเต็ปคืนนี้</h2>
    <div id="steps"></div>
    <button class="btn" id="copy" type="button">คัดลอกข้อความ LINE</button>
    <p class="note" id="status" role="status">กดแล้ววางใน LINE ได้เลย</p>
    <textarea id="msg" readonly aria-label="ข้อความ LINE"></textarea>
  </section>

  <p class="warn">ราคาและเส้นต่อรองมาจากตลาด ราคาจริงของแต่ละเจ้าอาจต่างกัน ถ้าเจ้าตั้งสูง/ต่ำที่ 3 ขึ้นไป ให้ข้ามคู่นั้น ชื่อทีมเป็นภาษาอังกฤษ</p>
  <p class="foot">ที่มา <a href="https://goal7.co">goal7</a>, <a href="https://www.kickoff.co.uk">Kickoff</a> · ข้อมูลจากสถิติ ไม่รับประกันผล</p>
</main>

<script>
(function () {
  var list = document.getElementById("list"), ta = document.getElementById("msg"), st = document.getElementById("status");
  var text = "";
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function team(x, home) {
    var ini = esc(x.n.replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase());
    return '<div class="team"><span class="badge" style="background:#34425f">' + ini +
      '<img alt="" src="' + esc(x.l) + '" onerror="this.remove()"></span><span class="nm">' + esc(x.n) + '</span>' +
      (home ? '<span class="home">เหย้า</span>' : '') + '</div>';
  }
  function box(l, v, pick) {
    return '<div class="box' + (pick ? ' pick' : '') + '"><small>' + l + '</small><b>' + esc(v) + '</b>' + (pick ? '<span class="tick">✓ เลือก</span>' : '') + '</div>';
  }
  function hm(t) { return t.replace(":", "."); }
  function line(m) { return "⏰" + hm(m.t) + " " + m.h.n + " พบ " + m.a.n + " " + m.ou.lab; }
  function render(d) {
    document.getElementById("sub").textContent = "อัปเดตล่าสุด " + d.updated + " เวลาตามไทย";
    if (!d.matches.length) { list.innerHTML = '<p class="note">ตอนนี้ยังไม่มีคู่ในลีกที่ติดตาม</p>'; return; }
    list.innerHTML = d.matches.map(function (m) {
      return '<article class="match' + (m.ou ? '' : ' skip') + '"><div class="top"><span class="league"><span class="flag">' + m.flag + '</span>' + esc(m.lg) +
        '</span><span class="time">' + esc(m.t) + '<small>' + esc(m.d) + '</small></span></div><div class="teams">' + team(m.h, true) + team(m.a, false) + '</div>' +
        '<div class="prices">' + box("ต่อรอง", m.hc || "ไม่มีราคา", false) + box("สูง/ต่ำ", m.ou ? m.ou.lab : "ไม่ชัด ข้าม", !!m.ou) + '</div>' +
        (m.ou ? '<div class="conf"><span>โอกาสจากราคาตลาด</span><div class="bar"><i style="width:' + m.ou.pct + '%"></i></div><em>' + m.ou.pct + '%</em></div>' : '') + '</article>';
    }).join("");
    var picks = d.matches.filter(function (m) { return m.ou; }).sort(function (a, b) { return b.ou.pct - a.ou.pct; });
    var rows = "", out = ["⚽️บอลวันที่ " + d.date + "⚽️", ""];
    [[3, "⚡"], [5, "🔥"], [7, "💣"]].forEach(function (s) {
      if (picks.length < s[0]) { rows += '<div class="row"><b>' + s[1] + ' สเต็ป ' + s[0] + '</b><span class="off">คู่ไม่พอ</span></div>'; return; }
      var c = picks.slice(0, s[0]).sort(function (a, b) { return a.ts - b.ts; });
      rows += '<div class="row"><b>' + s[1] + ' สเต็ป ' + s[0] + '</b><span>' + c.length + ' คู่ ดูในข้อความ</span></div>';
      out.push(s[1] + " สเต็ป " + s[0]); c.forEach(function (m) { out.push(line(m)); }); out.push("————————————");
    });
    if (picks.length) {
      out.push("⭐ ตัวเน้นสุด");
      picks.slice(0, 3).forEach(function (m, i) { out.push(["🥇", "🥈", "🥉"][i] + " " + m.h.n + " พบ " + m.a.n + " " + m.ou.lab); });
      out.push("");
    }
    out.push("ข้อมูลจากราคาตลาด ไม่รับประกันผล เล่นเฉพาะเงินที่เสียได้");
    text = out.join("\n"); ta.value = text;
    document.getElementById("steps").innerHTML = rows;
  }
  fetch("data.json?" + Date.now()).then(function (r) { return r.json(); }).then(render).catch(function () {
    list.innerHTML = '<p class="note">ยังไม่มีข้อมูล รอให้ระบบรันครั้งแรก</p>';
  });
  document.getElementById("copy").addEventListener("click", function () {
    function fb() { ta.focus(); ta.select(); st.textContent = "แตะค้างที่กล่องข้างล่างแล้วเลือกคัดลอก"; }
    try { navigator.clipboard.writeText(text).then(function () { st.textContent = "คัดลอกแล้ว ไปวางใน LINE ได้เลย"; }, fb); } catch (e) { fb(); }
  });
})();
</script></body></html>
